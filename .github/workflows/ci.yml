name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check . 

      - name: Run tests
        run: pytest -v
  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build into the local Docker daemon only; nothing is published yet
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-ci-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-ci-demo:${{ github.sha }}

      - name: Smoke test the image
        run: |
          docker run -d -p 8000:8000 --name test-container ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-ci-demo:${{ github.sha }}
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8000/health \
            || { docker logs test-container; exit 1; }
          docker stop test-container

      # Only reached if the smoke test passed
      - name: Push image
        run: docker push --all-tags ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-ci-demo